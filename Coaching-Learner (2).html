/* ============ SLOT PICKER ============ */
const SP_TZS = [
  {value:'IST',  label:'India Standard Time (GMT+5:30)',   offset:5.5},
  {value:'PT',   label:'Pacific Time (GMT-8:00)',          offset:-8},
  {value:'ET',   label:'Eastern Time (GMT-5:00)',          offset:-5},
  {value:'GMT',  label:'Greenwich Mean Time (GMT+0:00)',   offset:0},
  {value:'CET',  label:'Central European Time (GMT+1:00)', offset:1},
  {value:'GST',  label:'Gulf Standard Time (GMT+4:00)',    offset:4},
  {value:'SGT',  label:'Singapore Time (GMT+8:00)',        offset:8},
  {value:'JST',  label:'Japan Standard Time (GMT+9:00)',   offset:9},
];
const SP_AVAILABILITY = (()=>{
  const out = {};
  const now = new Date();
  for(let m=0;m<2;m++){
    const ref = new Date(now.getFullYear(), now.getMonth()+m, 1);
    const days = new Date(ref.getFullYear(), ref.getMonth()+1, 0).getDate();
    for(let d=1;d<=days;d++){
      const dt = new Date(ref.getFullYear(), ref.getMonth(), d);
      const dow = dt.getDay();
      if(dow===0||dow===6) continue;
      if(dt < new Date(now.getFullYear(),now.getMonth(),now.getDate())) continue;
      const iso = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const slots = ['9:00 AM','9:30 AM','10:00 AM','10:30 AM','11:00 AM','11:30 AM','12:00 PM','12:30 PM','2:00 PM','2:30 PM','3:00 PM','3:30 PM','4:00 PM','4:30 PM','5:00 PM','5:30 PM','6:00 PM','6:30 PM'];
      out[iso] = slots.map(t=>({time:t, taken:(d+t.length)%5===0}));
    }
  }
  return out;
})();
const SP_STATE = { date:null, slot:null, viewMonth:null, tz:'IST', progId:null, sessId:null };
function spConvertTime(timeStr, tgtOffset, addMin=0){
  const m = timeStr.match(/(\d+):(\d+)\s+(AM|PM)/);
  if(!m) return timeStr;
  let h = parseInt(m[1]);
  const mn = parseInt(m[2]);
  if(m[3]==='PM' && h!==12) h += 12;
  if(m[3]==='AM' && h===12) h = 0;
  let totalMin = h*60 + mn - 5.5*60 + tgtOffset*60 + addMin;
  totalMin = ((totalMin % 1440) + 1440) % 1440;
  const outH = Math.floor(totalMin/60);
  const outMin = totalMin % 60;
  const outPeriod = outH >= 12 ? 'PM' : 'AM';
  let displayH = outH % 12;
  if(displayH===0) displayH = 12;
  return `${displayH}:${String(outMin).padStart(2,'0')} ${outPeriod}`;
}
function spSlotRange(t, off){ return `${spConvertTime(t,off)} – ${spConvertTime(t,off,30)}`; }

function openSlotPicker(progId, sessId){
  const p = PROGRAMS.find(x=>x.id===progId); if(!p) return;
  const s = p.sessions.find(x=>x.id===sessId); if(!s) return;
  SP_STATE.progId = progId; SP_STATE.sessId = sessId;
  SP_STATE.viewMonth = new Date();
  SP_STATE.viewMonth = new Date(SP_STATE.viewMonth.getFullYear(), SP_STATE.viewMonth.getMonth(), 1);
  SP_STATE.date = Object.keys(SP_AVAILABILITY).sort()[0];
  SP_STATE.slot = null;
  renderSlotPicker(p, s);
  document.getElementById('modal-bg').classList.add('open');
  document.body.style.overflow='hidden';
}
function renderSlotPicker(p, s){
  if(!p) p = PROGRAMS.find(x=>x.id===SP_STATE.progId);
  if(!s) s = p.sessions.find(x=>x.id===SP_STATE.sessId);
  const c = COACHES[p.coach];
  const m = document.getElementById('modal');
  m.className='modal sp-modal';
  m.style.maxWidth='1040px';
  const v = SP_STATE.viewMonth;
  const y = v.getFullYear(), mo = v.getMonth();
  const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const first = new Date(y,mo,1).getDay();
  const days = new Date(y,mo+1,0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  const tzObj = SP_TZS.find(t=>t.value===SP_STATE.tz) || SP_TZS[0];

  let cells='';
  for(let i=0;i<first;i++) cells += `<div></div>`;
  for(let d=1;d<=days;d++){
    const iso = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dt = new Date(y,mo,d);
    const isPast = dt < today;
    const avail = !isPast && SP_AVAILABILITY[iso] && SP_AVAILABILITY[iso].some(x=>!x.taken);
    const sel = SP_STATE.date===iso;
    cells += `<div class="sp-cal-day ${avail?'avail':''} ${sel?'selected':''}" ${avail?`onclick="pickSPDate('${iso}')"`:''}>${d}</div>`;
  }

  const slotsHTML = SP_STATE.date && SP_AVAILABILITY[SP_STATE.date]
    ? `<div class="sp-slots-list">${SP_AVAILABILITY[SP_STATE.date].map(x=>{
        const sel = SP_STATE.slot===x.time && !x.taken;
        return `<button class="sp-slot ${sel?'selected':''}" ${x.taken?'disabled':''} onclick="pickSPSlot('${x.time}')">${spSlotRange(x.time, tzObj.offset)}</button>`;
      }).join('')}</div>`
    : `<div class="sp-empty">Select an available date to see open slots.</div>`;

  const footLeft = SP_STATE.slot
    ? `<div class="sp-foot-l">Booking <strong>${p.name} · Session ${s.num}</strong> on <strong>${new Date(SP_STATE.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</strong> at <strong>${spSlotRange(SP_STATE.slot, tzObj.offset)} ${tzObj.value}</strong></div>`
    : `<div class="sp-foot-l">Pick a date and time to book your session</div>`;

  m.innerHTML = `
    <div class="sp-h">
      <div class="sp-h-l">
        <div class="sp-h-t">Book Session ${s.num}</div>
        <div class="sp-h-d">${p.name} — ${c.name} · 30 min</div>
      </div>
      <button class="modal-x" onclick="closeSP()" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="sp-body">
      <div class="sp-info">
        <div class="sp-info-coach">
          <div class="sp-info-av"><img src="${c.avatar}" alt="${c.name}"></div>
          <div style="min-width:0;"><div class="sp-info-coach-name">${c.name}</div><div class="sp-info-coach-role">${c.role}</div></div>
        </div>
        <div>
          <div class="sp-info-section-h">Session ${s.num} of ${p.total}</div>
          <div class="sp-info-t">${s.name}</div>
        </div>
        <div class="sp-info-meta">
          <div class="sp-info-meta-row"><i class="fa-regular fa-clock"></i><span>30 minutes</span></div>
          <div class="sp-info-meta-row"><i class="fa-solid fa-video"></i><span>Zoom Meeting</span></div>
          <div class="sp-info-meta-row"><i class="fa-regular fa-comments"></i><span>1-on-1 with ${c.name}</span></div>
        </div>
        ${s.agenda ? `
        <div class="sp-info-divider"></div>
        <div>
          <div class="sp-info-section-h">Agenda</div>
          <div class="sp-info-section-d">${s.agenda}</div>
        </div>` : ''}
      </div>
      <div class="sp-cal">
        <div class="sp-cal-nav">
          <button class="sp-cal-arr" onclick="spNav(-1)"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="sp-cal-month">${MONTHS[mo]} ${y}</div>
          <button class="sp-cal-arr" onclick="spNav(1)"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
        <div class="sp-cal-grid">
          ${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="sp-cal-dow">${d}</div>`).join('')}
          ${cells}
        </div>
        <div style="margin-top:20px;">
          <div style="font-size:11.5px;font-weight:600;color:var(--t4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:flex;align-items:center;gap:6px;"><i class="fa-regular fa-clock" style="font-size:11px;"></i>Timezone</div>
          <div class="sel"><select onchange="setSPTz(this.value)">
            ${SP_TZS.map(t=>`<option value="${t.value}"${SP_STATE.tz===t.value?' selected':''}>${t.label}</option>`).join('')}
          </select></div>
        </div>
      </div>
      <div class="sp-slots">${slotsHTML}</div>
    </div>
    <div class="sp-foot">
      ${footLeft}
      <div style="display:flex;gap:10px;align-items:center;">
        <button class="btn btn-w" onclick="closeSP()">Cancel</button>
        <button class="btn" onclick="confirmBookSlot()" ${SP_STATE.slot?'':'disabled style=\"opacity:.45;cursor:not-allowed;\"'}>Confirm booking</button>
      </div>
    </div>`;
}
function pickSPDate(iso){ SP_STATE.date=iso; SP_STATE.slot=null; renderSlotPicker(); }
function pickSPSlot(t){ SP_STATE.slot=t; renderSlotPicker(); }
function spNav(dir){ SP_STATE.viewMonth = new Date(SP_STATE.viewMonth.getFullYear(), SP_STATE.viewMonth.getMonth()+dir, 1); renderSlotPicker(); }
function setSPTz(tz){ SP_STATE.tz=tz; renderSlotPicker(); }
function closeSP(){
  document.getElementById('modal').className='modal';
  document.getElementById('modal').style.maxWidth='460px';
  closeModal();
}
function confirmBookSlot(){
  const p = PROGRAMS.find(x=>x.id===SP_STATE.progId);
  const s = p.sessions.find(x=>x.id===SP_STATE.sessId);
  const tz = SP_TZS.find(t=>t.value===SP_STATE.tz);
  const c = COACHES[p.coach];
  s.state = 'upcoming';
  const dateStr = new Date(SP_STATE.date).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
  s.date = `${new Date(SP_STATE.date).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})} · ${spConvertTime(SP_STATE.slot, tz.offset)} ${tz.value}`;
  closeSP();
  showBookingConfirmation(p, s, c, dateStr, tz);
}

function showBookingConfirmation(p, s, c, dateStr, tz){
  const m = document.getElementById('modal');
  m.className = 'modal v2';
  m.style.maxWidth = '';
  const timeRange = `${spConvertTime(SP_STATE.slot, tz.offset)} – ${spConvertTime(SP_STATE.slot, tz.offset, 30)} ${tz.value}`;
  m.innerHTML = `
    <div class="modal-h">
      <div class="modal-t">You're booked in</div>
      <button class="modal-x" onclick="closeModal()" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-b">
      <p style="margin-bottom:18px;">A calendar invite has been sent to you and ${c.name}.</p>
      <div style="background:var(--g-neutral-200);border-radius:12px;padding:18px;">
        <div style="font-size:11px;font-weight:600;color:var(--t4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Session ${s.num}</div>
        <div style="font-size:16px;font-weight:600;color:var(--t1);margin-bottom:14px;">${s.name}</div>
        <div style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--t2);margin-bottom:6px;"><i class="fa-regular fa-calendar" style="color:var(--t4);width:14px;"></i>${dateStr}</div>
        <div style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--t2);margin-bottom:6px;"><i class="fa-regular fa-clock" style="color:var(--t4);width:14px;"></i>${timeRange}</div>
        <div style="display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--t2);"><i class="fa-regular fa-user" style="color:var(--t4);width:14px;"></i>with ${c.name}</div>
      </div>
      <div style="font-size:13px;color:var(--t3);margin-top:14px;line-height:1.55;">You'll get an email reminder 1 hour before the session. The Join button enables 5 minutes before the start time.</div>
    </div>
    <div class="modal-f">
      <button class="btn btn-w" onclick="closeModal()">View details</button>
      <button class="btn" onclick="closeModal()">Got it</button>
    </div>`;
  document.getElementById('modal-bg').classList.add('open');
  document.body.style.overflow = 'hidden';
  // Re-render underlying view so it's up to date when closed
  if(document.getElementById('det').classList.contains('open')){
    openProgDetail(p.id);
  } else {
    renderCoaching();
  }
}

/* ============ INIT ============ */
function applyRoute(){
  const hash = location.hash.replace(/^#/,'').trim().toLowerCase();
  if(!hash){ setView('home'); return; }
  const parts = hash.split('/');
  setView('home');
  // Close any open detail/modal first
  closeDet();
  closeModal();
  switch(parts[0]){
    case 'bookings':
      COACHING_TAB = 'bookings';
      BOOKING_VIEW = parts[1]==='calendar' ? 'calendar' : 'list';
      renderCoaching(); break;
    case 'programs':
      COACHING_TAB = 'programs'; renderCoaching(); break;
    case 'program':
      if(parts[1]) setTimeout(()=>openProgDetail(parts[1]), 50); break;
    case 'session':
      if(parts[1]){
        const sid = parts[1];
        const prog = PROGRAMS.find(p => p.sessions.some(s=>s.id===sid));
        if(prog) setTimeout(()=>openSessionDetail(sid, prog.id), 50);
      }
      break;
    case 'reschedule':
      setTimeout(()=>confirmReschedule('p1s2'), 50); break;
    case 'cancel':
      setTimeout(()=>confirmCancel('p1s2'), 50); break;
    case 'slot-picker':
      setTimeout(()=>openSlotPicker('pr1','p1s3'), 50); break;
    case 'booking-confirmed':
      setTimeout(()=>{
        const p = PROGRAMS.find(x=>x.id==='pr1');
        const s = p.sessions.find(x=>x.id==='p1s3');
        const c = COACHES[p.coach];
        SP_STATE.slot = '11:00 AM';
        SP_STATE.tz = 'IST';
        SP_STATE.date = '2026-05-15';
        const tz = SP_TZS.find(t=>t.value==='IST');
        showBookingConfirmation(p, s, c, 'Fri, May 15, 2026', tz);
      }, 50); break;
    case 'reschedule-limit':
      setTimeout(()=>rescheduleLimitReached(), 50); break;
    case 'cancel-deadline':
      setTimeout(()=>cancellationDeadlinePassed(), 50); break;
    case 'coach-unavailable':
      setTimeout(()=>coachUnavailable(), 50); break;
    case 'network-error':
      setTimeout(()=>networkError(), 50); break;
    case 'skeleton':
      setView('home');
      setTimeout(()=>showSkeleton(), 30); break;
    case 'calendar-empty':
      calendarEmpty(); break;
    case 'bookings-empty':
      COACHING_TAB='bookings'; BOOKING_VIEW='list';
      LRNFILTERS.status.clear(); LRNFILTERS.coach.clear(); LRNFILTERS.program.clear();
      window.__forceEmptyBookings = true;
      renderCoaching();
      window.__forceEmptyBookings = false;
      break;
    case 'bookings-filter-empty':
      COACHING_TAB='bookings'; BOOKING_VIEW='list';
      LRNFILTERS.status = new Set(['__nomatch__']);
      renderCoaching(); break;
    case 'programs-empty':
      COACHING_TAB='programs';
      LRNFILTERS.pstatus.clear(); LRNFILTERS.pcoach.clear();
      window.__forceEmptyPrograms = true;
      renderCoaching();
      window.__forceEmptyPrograms = false;
      break;
    case 'programs-filter-empty':
      COACHING_TAB='programs';
      LRNFILTERS.pstatus = new Set(['__nomatch__']);
      renderCoaching(); break;
  }
}
window.addEventListener('DOMContentLoaded', applyRoute);
window.addEventListener('hashchange', applyRoute);

/* =========================================================================
   CUSTOM DROPDOWN — auto-enhance every <select> on the page
   ========================================================================= */
(function(){
  let _openDD = null;

  function selectedText(sel){
    const o = sel.options[sel.selectedIndex];
    return o ? o.text : '';
  }

  function closeDD(){
    if(!_openDD) return;
    _openDD.trig.classList.remove('open');
    if(_openDD.menu && _openDD.menu.parentNode) _openDD.menu.parentNode.removeChild(_openDD.menu);
    document.removeEventListener('mousedown', outsideClose, true);
    document.removeEventListener('keydown', escClose, true);
    window.removeEventListener('scroll', closeDD, true);
    window.removeEventListener('resize', closeDD, true);
    _openDD = null;
  }
  function escClose(e){ if(e.key === 'Escape'){ e.stopPropagation(); closeDD(); } }
  function outsideClose(e){
    if(!_openDD) return;
    if(_openDD.menu.contains(e.target) || _openDD.trig.contains(e.target)) return;
    closeDD();
  }

  function openDD(sel, trig){
    if(_openDD && _openDD.trig === trig){ closeDD(); return; }
    closeDD();

    const menu = document.createElement('div');
    menu.className = 'dd-menu';
    const opts = Array.from(sel.options);
    menu.innerHTML = opts.map((o,i)=>{
      const isSel = i === sel.selectedIndex;
      const dis = o.disabled ? ' disabled' : '';
      return `<div class="dd-item${isSel?' selected':''}${dis}" data-idx="${i}">${o.innerHTML}</div>`;
    }).join('');

    document.body.appendChild(menu);

    const r = trig.getBoundingClientRect();
    const minW = Math.max(r.width, 160);
    menu.style.minWidth = minW + 'px';
    menu.style.left = r.left + 'px';
    menu.style.top = (r.bottom + 4) + 'px';

    const mr = menu.getBoundingClientRect();
    if(mr.bottom > window.innerHeight - 8){
      const newTop = r.top - mr.height - 4;
      if(newTop > 8) menu.style.top = newTop + 'px';
    }
    if(mr.right > window.innerWidth - 8){
      menu.style.left = Math.max(8, window.innerWidth - mr.width - 8) + 'px';
    }

    menu.addEventListener('click', e=>{
      const item = e.target.closest('.dd-item');
      if(!item || item.classList.contains('disabled')) return;
      const idx = parseInt(item.dataset.idx, 10);
      if(isNaN(idx) || idx === sel.selectedIndex){ closeDD(); return; }
      sel.selectedIndex = idx;
      const txt = trig.querySelector('.dd-trig-text');
      if(txt) txt.innerHTML = sel.options[idx].innerHTML;
      sel.dispatchEvent(new Event('input', {bubbles:true}));
      sel.dispatchEvent(new Event('change', {bubbles:true}));
      closeDD();
    });

    trig.classList.add('open');
    _openDD = { trig, menu, sel };

    setTimeout(()=>{
      document.addEventListener('mousedown', outsideClose, true);
      document.addEventListener('keydown', escClose, true);
      window.addEventListener('scroll', closeDD, true);
      window.addEventListener('resize', closeDD, true);
    }, 0);
  }

  function enhanceSelect(sel){
    if(!sel || sel.tagName !== 'SELECT') return;
    if(sel.dataset.ddEnhanced === '1') return;
    sel.dataset.ddEnhanced = '1';

    const trig = document.createElement('button');
    trig.type = 'button';
    trig.className = 'dd-trig';

    const origStyle = sel.getAttribute('style');
    if(origStyle) trig.setAttribute('style', origStyle);

    const txt = document.createElement('span');
    txt.className = 'dd-trig-text';
    txt.innerHTML = selectedText(sel) || '';
    trig.appendChild(txt);

    trig.addEventListener('click', e=>{
      e.preventDefault();
      e.stopPropagation();
      openDD(sel, trig);
    });

    sel.addEventListener('change', ()=>{
      const t = trig.querySelector('.dd-trig-text');
      if(t) t.innerHTML = selectedText(sel);
    });

    sel.classList.add('dd-enhanced');
    sel.parentNode.insertBefore(trig, sel);

    const cs = window.getComputedStyle(trig);
    const pr = parseInt(cs.paddingRight, 10) || 0;
    if(pr < 28) trig.style.paddingRight = '28px';
  }

  function enhanceAll(root){
    (root || document).querySelectorAll('select').forEach(s=>{
      if(s.dataset.ddEnhanced !== '1') enhanceSelect(s);
    });
  }

  const obs = new MutationObserver(muts=>{
    for(const m of muts){
      m.addedNodes.forEach(n=>{
        if(n.nodeType !== 1) return;
        if(n.tagName === 'SELECT'){ enhanceSelect(n); return; }
        if(n.querySelectorAll){ n.querySelectorAll('select').forEach(s=>{ if(s.dataset.ddEnhanced !== '1') enhanceSelect(s); }); }
      });
    }
  });

  function boot(){
    enhanceAll();
    obs.observe(document.body, { childList:true, subtree:true });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
