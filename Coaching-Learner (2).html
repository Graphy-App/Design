<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graphy — My Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
/* ============ GRAPHY TOKENS ============ */
:root {
  --g-brand-100:#E0E9FF; --g-brand-200:#A4BAFD; --g-brand-300:#5766F2; --g-brand-400:#2F31A4; --g-brand-500:#1A1B4C;
  --g-brand-primary:var(--g-brand-300); --g-brand-primary-hover:var(--g-brand-400);
  --g-brand-secondary:#D8FD49;
  --g-magenta-100:#FEDFF3; --g-magenta-200:#FFACE5; --g-magenta-300:#CA26A5;
  --g-blue-100:#CDEEF3; --g-blue-300:#007F8C;
  --g-orange-100:#FEE2D4; --g-orange-300:#C54600;
  --g-neutral-100:#FFFFFF; --g-neutral-200:#F7F9FA; --g-neutral-300:#E5E5E5;
  --g-neutral-400:#D2D6D8; --g-neutral-500:#AAB1B7; --g-neutral-600:#878C90;
  --g-neutral-700:#393F41; --g-neutral-800:#232228;
  --g-error-100:#FFEDED; --g-error-300:#DE1135;
  --g-warning-100:#FFE8B8; --g-warning-300:#9F6402;
  --g-success-100:#DDFFC4; --g-success-300:#45A124;
  --g-font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --g-radius-pill:41px;
}
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:var(--g-neutral-200);
  --bd:var(--g-neutral-300); --bd2:var(--g-neutral-400);
  --t1:var(--g-neutral-800); --t2:var(--g-neutral-700); --t3:var(--g-neutral-600); --t4:var(--g-neutral-500);
}
html,body{height:100%;}
body{font-family:var(--g-font-sans);background:var(--bg);color:var(--t1);font-size:14px;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

/* ============ APP SHELL ============ */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;transition:grid-template-columns .22s ease;}
.skel{background:linear-gradient(90deg,var(--g-neutral-200) 0%,var(--g-neutral-300) 50%,var(--g-neutral-200) 100%);background-size:200% 100%;animation:skelpulse 1.4s ease-in-out infinite;border-radius:6px;}
@keyframes skelpulse{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.app.side-collapsed{grid-template-columns:72px 1fr;}
.side{transition:width .22s ease;}
.side.collapsed{width:72px;padding:16px 8px;align-items:center;}
.side.collapsed .brand-name,.side.collapsed .nav-label,.side.collapsed .nav-chev,.side.collapsed .sf-info,.side.collapsed .nav-sub,.side.collapsed .nav-beta,.side.collapsed .side-cta{display:none;}
.side.collapsed .nav-item{justify-content:center;padding:10px;gap:0;}
.side.collapsed .nav-item > i:first-child{width:auto;margin:0;}
.side.collapsed .sf{justify-content:center;}
.side-toggle-wrap{position:fixed;left:248px;top:50%;transform:translate(-50%,-50%);width:24px;height:60px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:50;transition:left .22s ease;}
.app.side-collapsed .side-toggle-wrap{left:72px;}
.side-toggle-dash{width:2px;height:28px;border-radius:99px;background:var(--g-neutral-400);transition:opacity .15s;}
.side-toggle{position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;border:1px solid var(--bd);color:var(--t3);display:flex;align-items:center;justify-content:center;font-size:10px;box-shadow:0 1px 2px rgba(0,0,0,.06);opacity:0;transition:opacity .15s;}
.side-toggle-wrap:hover .side-toggle-dash{opacity:0;}
.side-toggle-wrap:hover .side-toggle{opacity:1;}
.side-toggle:hover{background:var(--g-neutral-200);color:var(--t1);border-color:var(--g-neutral-400);}
.app.side-collapsed .side-toggle i{transform:rotate(180deg);}

/* ============ SIDEBAR ============ */
.side{background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:16px 12px;gap:2px;position:sticky;top:0;height:100vh;overflow:hidden;}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px 16px;}
.brand-logo{width:40px;height:40px;border-radius:10px;flex-shrink:0;background:#111;display:flex;align-items:center;justify-content:center;position:relative;color:#fff;font-size:15px;}
.sun{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,0.35);box-shadow:0 0 0 3px rgba(255,255,255,0.18);}
.brand-name{font-size:15px;font-weight:700;color:var(--t1);letter-spacing:-.2px;}

.nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}
.nav::-webkit-scrollbar{display:none;}
.nav-item{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:10px;color:var(--t1);text-decoration:none;font-size:14px;font-weight:400;cursor:pointer;}
.nav-item:hover{background:var(--g-neutral-200);}
.nav-item > i:first-child{width:20px;text-align:center;font-size:16px;color:var(--t3);flex-shrink:0;}
.nav-item > i.ph:first-child{font-size:18px;line-height:1;}
.nav-item.nav-active{background:var(--g-brand-100);color:var(--g-brand-primary);font-weight:500;}
.nav-item.nav-active > i:first-child{color:var(--g-brand-primary);font-weight:900;}
.nav-item.nav-active > i:first-child.fa-regular{font-family:"Font Awesome 6 Free";font-weight:900;}
.nav-chev{margin-left:auto;font-size:11px;color:var(--t4);flex-shrink:0;transition:transform .2s;}

/* nav sub */
.nav-sub{display:none;flex-direction:column;gap:1px;padding:2px 0 4px 38px;}
.nav-sub.nav-sub-open{display:flex;}
.nav-sub a{padding:8px 14px;border-radius:8px;color:var(--t2);font-size:13.5px;text-decoration:none;display:block;cursor:pointer;}
.nav-sub a:hover{background:var(--g-neutral-200);}
.nav-sub a.active{background:#EEF0FF;color:var(--g-brand-primary);font-weight:500;}

/* sidebar CTAs */
.side-cta{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:12px;border:none;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;width:100%;margin-top:6px;transition:background .12s;}
.side-cta i{font-size:14px;}
.side-cta.brand{background:var(--g-brand-100);color:var(--g-brand-primary);}
.side-cta.brand:hover{background:#D1DCFF;}
.side-cta.orange{background:#FFF6E5;color:#9F4F02;}
.side-cta.orange:hover{background:#FFEED1;}

.sf{margin-top:14px;border-top:1px solid var(--bd);padding:14px 8px 0;display:flex;align-items:center;gap:10px;}
.sf-av{width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--g-brand-200);flex-shrink:0;}
.sf-av img{width:100%;height:100%;object-fit:cover;}
.sf-name{font-size:13.5px;font-weight:500;color:var(--t1);}
.sf-role{font-size:11.5px;color:var(--t3);margin-top:1px;}
.sf-more{background:none;border:none;color:var(--t4);width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;}
.sf-more:hover{background:var(--g-neutral-200);color:var(--t1);}

/* ============ MAIN ============ */
.main{display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;padding:24px 32px 8px;gap:16px;}
.page-title{font-size:26px;font-weight:500;letter-spacing:-.4px;color:var(--t1);}
.tb-actions{margin-left:auto;display:flex;gap:10px;align-items:center;}

.icon-btn{width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;color:var(--t2);font-size:14px;cursor:pointer;transition:.12s;}
.icon-btn:hover{border-color:var(--t1);color:var(--t1);background:var(--g-neutral-200);}

.btn{display:inline-flex;align-items:center;gap:8px;padding:0 22px;height:42px;border-radius:99px;font-size:14px;font-weight:500;border:1px solid transparent;background:var(--g-brand-primary);color:#fff;transition:.14s;}
.btn:hover{background:var(--g-brand-primary-hover);box-shadow:0 4px 12px -4px rgba(87,102,242,.45);}
.btn:active{transform:translateY(1px);box-shadow:none;}
.btn:disabled,.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;}
.btn-w{background:#fff;color:var(--t1);border-color:var(--bd);}
.btn-w:hover{background:var(--g-neutral-200);border-color:var(--g-neutral-500);box-shadow:none;}
.btn-sm{height:34px;padding:0 16px;font-size:13px;}
.btn-t{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--g-brand-primary);font-size:14px;font-weight:500;padding:0;height:auto;}
.btn-t:hover{text-decoration:underline;text-underline-offset:3px;}

.content{padding:0 32px 60px;display:flex;flex-direction:column;gap:24px;}
.panel{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:24px;}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px;}
.panel-title{font-size:20px;font-weight:500;color:var(--t1);letter-spacing:-.2px;}
.view-toggle{display:flex;background:var(--g-neutral-200);border-radius:8px;padding:3px;gap:2px;}
.vtab{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:6px;border:none;background:transparent;font-family:inherit;font-size:13px;font-weight:500;color:var(--t3);cursor:pointer;}
.vtab:hover{color:var(--t1);}
.vtab.active{background:#fff;color:var(--t1);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.vtab i{font-size:12px;}

/* ============ SECTIONS ============ */
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:0 4px;}
.sec-h-t{font-size:18px;font-weight:600;color:var(--t1);letter-spacing:-.2px;}
.sec-h-d{font-size:13px;color:var(--t3);margin-top:2px;}

/* ============ PROGRAMS GRID (creator parity) ============ */
.filter-lbl{font-size:13px;color:var(--t3);}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.pcard{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;display:flex;flex-direction:column;cursor:pointer;transition:.15s;}
.pcard:hover{border-color:var(--g-brand-200);box-shadow:0 12px 28px -16px rgba(17,17,17,.14);}
.pthumb{aspect-ratio:16/10;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--g-neutral-200);}
.pthumb-img{width:100%;height:100%;object-fit:cover;}
.pcard-body{display:flex;flex-direction:column;gap:6px;padding-top:14px;flex:1;}
.pcard-meta-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.pcard-more{background:none;border:none;color:var(--t3);font-size:15px;padding:2px 4px;line-height:1;cursor:pointer;}
.ps{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:6px;font-size:12px;font-weight:500;}
.ps-active{background:var(--g-brand-100);color:var(--g-brand-primary);}
.ps-completed{background:var(--g-success-100);color:var(--g-success-300);}
.ps-expired{background:var(--g-error-100);color:var(--g-error-300);}
.ps-paused{background:var(--g-neutral-200);color:var(--t3);}
.pcard-name{font-size:18px;font-weight:600;color:var(--t1);letter-spacing:-.2px;}
.pcard-coach{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t3);margin-top:2px;}
.pcard-coach .av{width:22px;height:22px;border-radius:50%;overflow:hidden;flex-shrink:0;}
.pcard-coach .av img{width:100%;height:100%;object-fit:cover;}
.pcard-prog{margin-top:auto;padding-top:14px;}
.pcard-prog-l{display:flex;justify-content:space-between;font-size:12.5px;color:var(--t3);margin-bottom:6px;}
.pcard-prog-l strong{color:var(--t1);font-weight:600;}
.pcard-bar{display:flex;gap:3px;height:5px;}
.pcard-bar > span{flex:1;background:var(--g-neutral-300);border-radius:99px;height:100%;display:block;}
.pcard-bar > span.done{background:var(--g-brand-primary);}
.pcard-bar > span.done-success{background:var(--g-success-300);}

/* ============ SESSIONS / BOOKINGS LIST ============ */
.sess-list{display:flex;flex-direction:column;gap:12px;}
.sess-card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:20px 22px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;transition:.12s;}
.sess-card:hover{border-color:var(--g-neutral-400);}
.sess-date{display:flex;flex-direction:column;align-items:center;justify-content:center;width:60px;background:var(--g-brand-100);color:var(--g-brand-primary);border-radius:12px;padding:10px 6px;flex-shrink:0;}
.sess-date.completed{background:var(--g-neutral-200);color:var(--t3);}
.sess-date.missed{background:var(--g-error-100);color:var(--g-error-300);}
.sess-date-m{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.sess-date-d{font-size:22px;font-weight:600;letter-spacing:-.4px;line-height:1.1;}
.sess-info{min-width:0;}
.sess-status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
.sess-status.upcoming{background:var(--g-success-100);color:var(--g-success-300);}
.sess-status.completed{background:var(--g-neutral-200);color:var(--t3);}
.sess-status.cancelled{background:var(--g-error-100);color:var(--g-error-300);}
.sess-status.missed{background:var(--g-warning-100);color:var(--g-warning-300);}
.sess-status.pending{background:var(--g-brand-100);color:var(--g-brand-primary);}
.sess-status.expired{background:var(--g-error-100);color:var(--g-error-300);}
.sess-title{font-size:15px;font-weight:600;color:var(--t1);letter-spacing:-.2px;line-height:1.3;}
.sess-meta{display:flex;align-items:center;gap:14px;margin-top:6px;font-size:12.5px;color:var(--t3);flex-wrap:wrap;}
.sess-meta span{display:inline-flex;align-items:center;gap:6px;}
.sess-meta i{font-size:11px;color:var(--t4);}
.sess-actions{display:flex;gap:8px;flex-shrink:0;}

/* ============ TABS ============ */
.tabs{display:flex;gap:32px;padding:6px 32px 0;border-bottom:1px solid var(--bd);background:var(--bg);}
.tab{display:inline-flex;align-items:center;gap:8px;padding:14px 4px;background:none;border:none;font-size:14.5px;font-weight:500;color:var(--t3);position:relative;}
.tab i{font-size:13px;}
.tab:hover{color:var(--t1);}
.tab.active{color:var(--g-brand-primary);}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--g-brand-primary);border-radius:2px 2px 0 0;}

/* Search + filter (creator parity) */
.search{position:relative;}
.search input{width:100%;height:46px;border-radius:10px;border:1px solid var(--bd);background:#fff;padding:0 18px 0 46px;font-family:inherit;font-size:14px;color:var(--t1);outline:none;}
.search input::placeholder{color:var(--t4);}
.search input:focus{border-color:var(--g-brand-primary);}
.search i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--t4);font-size:14px;}

.filterbar{display:flex;align-items:center;gap:10px;margin:14px 0 18px;flex-wrap:wrap;}
.fdrop{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--bd);background:#fff;font-size:13px;color:var(--t2);cursor:pointer;}
.fdrop i{color:var(--t4);font-size:10px;}
.fdrop:hover{border-color:var(--g-neutral-500);}
.fdrop-active{border-color:var(--g-neutral-400);background:#fff;}
.fdrop-count{color:var(--g-brand-primary);font-weight:600;margin-left:2px;}
.filter-reset{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:8px;border:none;background:none;color:var(--g-brand-primary);font-size:13px;font-weight:500;cursor:pointer;}
.filter-reset:hover{background:var(--g-brand-100);}
.filter-reset i{font-size:12px;}
.pager{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t3);}
.arr{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--t2);font-size:12px;cursor:pointer;}
.arr:hover{border-color:var(--g-neutral-500);}
.arr.dim{color:var(--t4);cursor:default;}
.arr.dim:hover{border-color:var(--bd);}

/* Bookings table */
.btable{display:flex;flex-direction:column;}
.btable-head{display:grid;grid-template-columns:2.4fr 1.3fr 1.2fr 1fr 110px 40px;gap:18px;padding:0 4px 12px;font-size:11px;font-weight:600;color:var(--t4);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--bd);}
.brow{display:grid;grid-template-columns:2.4fr 1.3fr 1.2fr 1fr 110px 40px;gap:18px;align-items:center;padding:18px 4px;border-bottom:1px solid var(--bd);cursor:pointer;transition:background .12s;position:relative;}
.bsess-sub{font-size:12.5px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brow:last-child{border-bottom:none;}
.brow:hover{background:var(--g-neutral-200);}
.bprog-cell{display:flex;align-items:center;gap:14px;min-width:0;}
.bthumb{width:48px;height:48px;border-radius:10px;flex-shrink:0;background-size:cover;background-position:center;background-color:var(--g-neutral-200);}
.bprog-name{font-size:14px;font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bsess-name{font-size:13.5px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bdate{font-size:13.5px;color:var(--t1);font-weight:500;line-height:1.3;}
.bdate small{display:block;color:var(--t3);font-size:12.5px;margin-top:3px;font-weight:400;}
.bsess-prog{display:flex;flex-direction:column;gap:6px;width:140px;max-width:140px;}
.bsess-prog-l{font-size:12.5px;color:var(--t3);}
.bsess-prog-l strong{color:var(--t1);font-weight:600;}
.bsess-prog-bar{display:flex;gap:3px;height:5px;}
.bsess-prog-bar > span{flex:1;background:var(--g-neutral-300);border-radius:99px;height:100%;display:block;}
.bsess-prog-bar > span.done{background:var(--g-brand-primary);}
.bsess-prog-bar > span.done-success{background:var(--g-success-300);}
.bstatus{display:inline-flex;align-items:center;padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;}
.bs-up{background:var(--g-success-100);color:var(--g-success-300);}
.bs-cm{background:var(--g-neutral-200);color:var(--t3);}
.bs-cn{background:var(--g-error-100);color:var(--g-error-300);}
.bs-ms{background:var(--g-warning-100);color:var(--g-warning-300);}
.bs-pn{background:var(--g-brand-100);color:var(--g-brand-primary);}
.bs-ex{background:var(--g-error-100);color:var(--g-error-300);}
.bs-live{background:#fee2e2;color:#dc2626;display:inline-flex;align-items:center;gap:6px;}
.bs-live::before{content:"";width:6px;height:6px;border-radius:50%;background:#dc2626;animation:livepulse 1.6s infinite;}
.bact{display:flex;justify-content:flex-start;}
.b-join{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 22px;border-radius:99px;background:var(--g-brand-primary);color:#fff;border:none;font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;transition:.12s;}
.b-join:hover{background:var(--g-brand-primary-hover);}
.b-join.disabled,.btn.disabled,.btn-w.disabled,.b-join.b-watch.disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
.b-join.disabled:hover,.btn.disabled:hover,.btn-w.disabled:hover,.b-join.b-watch.disabled:hover{box-shadow:none;}
.b-join.disabled:hover{background:var(--g-brand-primary);}
.btn-w.disabled:hover,.b-join.b-watch.disabled:hover{background:#fff;border-color:var(--bd);color:var(--t1);}
[data-tip]{position:relative;}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;font-size:12px;font-weight:500;padding:7px 11px;border-radius:6px;white-space:nowrap;z-index:1000;pointer-events:none;letter-spacing:0;}
[data-tip]:hover::before{content:"";position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#1a1a1a;z-index:1000;pointer-events:none;}
.b-join.b-watch{background:#fff;color:var(--t1);border:1px solid var(--bd);}
.b-join.b-watch:hover{border-color:var(--g-neutral-500);background:var(--g-neutral-200);}
.b-kebab{background:none;border:none;color:var(--t3);width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;}
.b-kebab:hover{background:var(--g-neutral-200);color:var(--t1);}
/* Read-only content (Agenda, Notes, Summary on learner side) */
.ro-box{font-size:13.5px;color:var(--t2);line-height:1.7;background:var(--g-neutral-200);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;white-space:pre-wrap;}
.ro-box.empty{color:var(--t4);font-style:italic;}
.sess-summary-box{font-size:13.5px;color:var(--t2);line-height:1.7;background:var(--g-neutral-200);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;}
/* Recording expiry */
.rec-expiry{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap;}
.rec-days{font-size:12px;color:var(--t3);display:inline-flex;align-items:center;gap:5px;}
.rec-days.expired{color:var(--g-error-300);}
.rec-email-note{background:var(--g-neutral-200);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--t3);margin-top:10px;line-height:1.55;}
.video-expired-placeholder{aspect-ratio:16/9;background:var(--g-neutral-200);border:1px solid var(--bd);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--t4);margin-top:14px;}

/* Calendar view */
.cal-nav{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.cal-nav-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--t2);font-size:13px;cursor:pointer;}
.cal-nav-btn:hover{border-color:var(--t1);}
.cal-month-label{font-size:17px;font-weight:600;color:var(--t1);letter-spacing:-.2px;min-width:160px;}
.cal-grid-head{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--bd);margin-bottom:0;}
.cal-grid-head > div{padding:10px 0;text-align:center;font-size:11px;font-weight:600;color:var(--t4);text-transform:uppercase;letter-spacing:.06em;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.cal-cell{min-height:110px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:10px 10px 8px;display:flex;flex-direction:column;gap:4px;}
.cal-cell:nth-child(7n){border-right:none;}
.cal-cell.other-month .cal-day{color:var(--t4);}
.cal-cell.today .cal-day{background:var(--g-brand-primary);color:#fff;border-radius:50%;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;}
.cal-day{font-size:13px;font-weight:500;color:var(--t2);line-height:1;margin-bottom:4px;}
.cal-event{display:flex;align-items:center;gap:5px;padding:3px 7px;border-radius:5px;font-size:11.5px;font-weight:500;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cal-event:hover{filter:brightness(.95);}
.cal-event.ev-up{background:var(--g-success-100);color:var(--g-success-300);}
.cal-event.ev-co{background:var(--g-neutral-200);color:var(--t3);}
.cal-event.ev-ca{background:var(--g-error-100);color:var(--g-error-300);}
.cal-event.ev-mi{background:var(--g-warning-100);color:var(--g-warning-300);}
.cal-event.ev-pn{background:var(--g-brand-100);color:var(--g-brand-primary);}
.cal-event i{font-size:9px;flex-shrink:0;}
.cal-more{font-size:11px;color:var(--t4);padding:2px 6px;cursor:pointer;}
.cal-more:hover{color:var(--g-brand-primary);}

/* Row menu popover */
.rmenu{position:fixed;background:#fff;border:1px solid var(--bd);border-radius:12px;box-shadow:0 8px 32px -8px rgba(0,0,0,.16);z-index:500;min-width:180px;padding:6px;}
.rmenu button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border:none;background:none;font-family:inherit;font-size:13.5px;color:var(--t1);cursor:pointer;border-radius:8px;text-align:left;}
.rmenu button:hover{background:#EFF1F4;}
.rmenu button i{color:var(--t4);font-size:13px;width:14px;text-align:center;}
.rmenu button.danger{color:var(--g-error-300);}
.rmenu button.danger i{color:var(--g-error-300);}
.rmenu .sep{height:1px;background:var(--bd);margin:4px 0;}

/* Filter panel */
.fpanel{position:fixed;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:0 8px 32px -8px rgba(0,0,0,.16);z-index:500;min-width:220px;}
.fcheck-item{display:flex;align-items:center;gap:12px;padding:10px 6px;cursor:pointer;border-radius:8px;}
.fcheck-item:hover{background:var(--g-neutral-200);}
.fcheck-box{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--bd2);background:#fff;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:.12s;}
.fcheck-box.checked{background:var(--g-brand-primary);border-color:var(--g-brand-primary);}
.fcheck-box.checked::after{content:'\f00c';font-family:"Font Awesome 6 Free";font-weight:900;font-size:10px;color:#fff;}
.fcheck-label{font-size:14px;color:var(--t1);}
.fpanel-apply{width:100%;height:42px;border-radius:99px;background:var(--g-brand-primary);color:#fff;border:none;font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;margin-top:10px;}
.fpanel-apply:hover{background:var(--g-brand-primary-hover);}

/* ============ DETAIL PAGE ============ */
.det{grid-column:2;grid-row:1;background:var(--bg);display:none;flex-direction:column;min-height:100vh;}
.det.open{display:flex;}
.det-top{display:flex;align-items:center;gap:14px;padding:18px 32px;}
.det-back{width:40px;height:40px;background:none;border:none;color:var(--t2);display:inline-flex;align-items:center;justify-content:center;font-size:16px;border-radius:8px;}
.det-back:hover{background:var(--g-neutral-200);color:var(--t1);}
.det-title{font-size:22px;font-weight:600;color:var(--t1);letter-spacing:-.3px;}
.det-actions{margin-left:auto;display:flex;gap:10px;}
.det-body{padding:6px 32px 60px;display:flex;flex-direction:column;gap:20px;}

/* Plan stats */
.plan-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.plan-card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:8px;}
.plan-card-l{font-size:12.5px;color:var(--t3);font-weight:500;display:flex;align-items:center;gap:7px;}
.plan-card-l i{color:var(--t4);font-size:13px;}
.plan-card-v{font-size:18px;font-weight:600;color:var(--t1);letter-spacing:-.2px;line-height:1.25;}
.plan-card-sub{font-size:12.5px;color:var(--t3);}
.plan-card-bar{display:flex;gap:3px;height:5px;margin-top:4px;}
.plan-card-bar > span{flex:1;background:var(--g-neutral-300);border-radius:99px;height:100%;display:block;}
.plan-card-bar > span.done{background:var(--g-brand-primary);}

/* Session cards in detail */
.mt-card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:20px 22px;transition:box-shadow .15s;}
.mt-card.open{box-shadow:0 4px 16px -4px rgba(17,17,17,.1);}
.mt-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
.mt-chev{transition:transform .2s;color:var(--t4);font-size:12px;flex-shrink:0;margin-top:2px;}
.mt-card.open .mt-chev{transform:rotate(180deg);}
.mt-acc-body{display:none;}
.mt-card.open .mt-acc-body{display:block;}
.mt-time{font-size:13px;color:var(--t3);font-weight:500;display:flex;align-items:center;gap:10px;}
.mt-status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:6px;text-transform:uppercase;letter-spacing:.04em;}
.mt-status.upcoming{background:var(--g-success-100);color:var(--g-success-300);}
.mt-status.completed{background:var(--g-neutral-200);color:var(--t3);}
.mt-status.cancelled{background:var(--g-error-100);color:var(--g-error-300);}
.mt-status.missed{background:var(--g-warning-100);color:var(--g-warning-300);}
.mt-status.pending{background:var(--g-brand-100);color:var(--g-brand-primary);}
.mt-status.expired{background:var(--g-error-100);color:var(--g-error-300);}
.mt-status.live{background:#fee2e2;color:#dc2626;display:inline-flex;align-items:center;gap:6px;}
.mt-status.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#dc2626;animation:livepulse 1.6s infinite;}
@keyframes livepulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(1.3);}}
.mt-title{font-size:16px;font-weight:500;color:var(--t1);letter-spacing:-.2px;margin-top:8px;}
.mt-card-meta{display:flex;align-items:center;gap:18px;margin-top:8px;flex-wrap:wrap;}
.mt-card-meta span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t3);}
.mt-card-meta i{font-size:13px;}
.mt-meta{display:flex;align-items:center;gap:18px;font-size:13px;color:var(--t3);margin-top:10px;flex-wrap:wrap;}
.mt-meta span{display:inline-flex;align-items:center;gap:7px;}
.mt-meta i{font-size:12px;color:var(--t4);}
.mt-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
.mt-section{margin-top:18px;}
.mt-section-h{font-size:11.5px;font-weight:600;color:var(--t4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.mt-section-h i{color:var(--t4);font-size:12px;}
.mt-attach{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--g-neutral-200);border:1px solid var(--bd);border-radius:10px;}
.mt-attach .ico{width:34px;height:34px;background:#fff;color:var(--g-brand-primary);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.mt-attach-name{font-size:13.5px;font-weight:500;color:var(--t1);}
.mt-attach-sub{font-size:12px;color:var(--t4);margin-top:1px;}

.mt-video{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#0b0b0d;cursor:pointer;}
.mt-video img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92;}
.mt-video-bar{position:absolute;top:0;left:0;right:0;height:22px;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 100%);display:flex;align-items:center;gap:5px;padding:0 10px;}
.mt-video-bar .dot{width:8px;height:8px;border-radius:50%;}
.mt-video-bar .dot.r{background:#ff5f57;} .mt-video-bar .dot.y{background:#febc2e;} .mt-video-bar .dot.g{background:#28c840;}
.mt-video-bar .lbl{margin-left:auto;font-size:11px;color:rgba(255,255,255,.7);font-weight:500;}
.mt-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;color:var(--g-neutral-800);font-size:22px;box-shadow:0 8px 24px rgba(0,0,0,.3);}

/* Transcript */
.tx-wrap{background:var(--g-neutral-200);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:14px;max-height:380px;overflow-y:auto;}
.tx-line{display:flex;gap:14px;}
.tx-time{font-size:12px;color:var(--t4);font-variant-numeric:tabular-nums;font-weight:500;flex-shrink:0;width:42px;padding-top:1px;}
.tx-sp{font-size:12px;font-weight:600;margin-bottom:3px;}
.tx-sp.coach{color:var(--g-brand-primary);}
.tx-sp.learner{color:var(--g-magenta-300);}
.tx-text{font-size:13.5px;color:var(--t2);line-height:1.55;}
.tx-more{font-size:12px;color:var(--t4);text-align:center;padding-top:6px;border-top:1px dashed var(--bd);}

/* Vertical timeline (sessions) */
.tl-wrap{position:relative;padding-left:26px;margin-top:8px;}
.tl-wrap::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--g-neutral-300);border-radius:1px;}
.tl-day{position:relative;margin-bottom:24px;}
.tl-day:last-child{margin-bottom:0;}
.tl-day::before{content:"";position:absolute;left:-26px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--g-brand-primary);box-shadow:0 0 0 4px var(--bg);}
.tl-day-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
.tl-day-t{font-size:15px;font-weight:600;color:var(--t1);}
.tl-day-sub{font-size:13px;color:var(--t3);}
.tl-item{position:relative;margin-bottom:16px;}
.tl-item:last-child{margin-bottom:0;}
.tl-num{width:28px;height:28px;border-radius:50%;background:var(--g-brand-100);color:var(--g-brand-primary);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex-shrink:0;}
.psess-num{width:28px;height:28px;border-radius:50%;background:var(--g-brand-100);color:var(--g-brand-primary);display:inline-flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex-shrink:0;}
.mt-head-l{flex:1;min-width:0;}
.mt-card{margin-bottom:12px;cursor:pointer;}
.mt-card:last-child{margin-bottom:0;}

/* DISCOVER cards */

/* ============ MODAL (slot picker, reschedule, cancel, confirm) ============ */
.modal-bg{position:fixed;inset:0;background:rgba(15,15,20,.45);z-index:1000;display:none;align-items:center;justify-content:center;padding:24px;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:16px;width:100%;max-width:460px;box-shadow:0 24px 60px -20px rgba(17,17,17,.28);overflow:hidden;}
.modal-h{padding:22px 24px 4px;display:flex;align-items:flex-start;gap:14px;}
.modal-ico{width:40px;height:40px;border-radius:10px;background:var(--g-brand-100);color:var(--g-brand-primary);display:inline-flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.modal-ico.danger{background:var(--g-error-100);color:var(--g-error-300);}
.modal-ico.warning{background:var(--g-warning-100);color:var(--g-warning-300);}
.modal-ico.success{background:var(--g-success-100);color:var(--g-success-300);}
.modal-t{font-size:17px;font-weight:600;color:var(--t1);letter-spacing:-.2px;flex:1;padding-top:8px;}
.modal-x{background:none;border:none;color:var(--t3);width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:14px;}
.modal-x:hover{background:var(--g-neutral-200);color:var(--t1);}
.modal-b{padding:10px 24px 22px;font-size:13.5px;color:var(--t2);line-height:1.55;}
.modal-b strong{color:var(--t1);}
.modal-f{padding:14px 24px 22px;display:flex;justify-content:flex-end;gap:10px;}

/* v2 modal style — heading + divider + body + divider + footer */
.modal.v2{max-width:560px;}
.modal.v2 .modal-h{padding:24px 28px;border-bottom:1px solid var(--bd);align-items:center;}
.modal.v2 .modal-t{font-size:24px;font-weight:500;letter-spacing:-.4px;padding-top:0;color:var(--t1);}
.modal.v2 .modal-ico{display:none;}
.modal.v2 .modal-x{width:36px;height:36px;border-radius:50%;background:var(--g-neutral-200);}
.modal.v2 .modal-x:hover{background:var(--g-neutral-300);}
.modal.v2 .modal-b{padding:22px 28px;font-size:15px;line-height:1.6;color:var(--t1);}
.modal.v2 .modal-f{padding:18px 28px;border-top:1px solid var(--bd);gap:12px;}
.modal.v2 .modal-f .btn,.modal.v2 .modal-f .btn-w{height:46px;padding:0 28px;font-size:15px;}
.btn-danger{background:#ef4444;color:#fff;border-color:#ef4444;}
.btn-danger:hover{background:#dc2626;border-color:#dc2626;}
.btn-danger{background:var(--g-error-300);color:#fff;}
.btn-danger:hover{background:var(--g-error-200);}

/* Slot picker (Calendly-style) */
.sp-modal{max-width:1040px;}
.sp-h{padding:22px 26px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:14px;}
.sp-h-l{flex:1;}
.sp-h-t{font-size:18px;font-weight:600;color:var(--t1);}
.sp-h-d{font-size:13px;color:var(--t3);margin-top:3px;}
.sp-body{display:grid;grid-template-columns:340px 1fr 280px;min-height:380px;}
.sp-info{padding:24px 22px;border-right:1px solid var(--bd);background:var(--g-neutral-200);display:flex;flex-direction:column;gap:18px;}
.sp-info-coach{display:flex;align-items:center;gap:12px;}
.sp-info-av{width:44px;height:44px;border-radius:50%;overflow:hidden;flex-shrink:0;}
.sp-info-av img{width:100%;height:100%;object-fit:cover;}
.sp-info-coach-name{font-size:14px;font-weight:600;color:var(--t1);}
.sp-info-coach-role{font-size:12px;color:var(--t3);margin-top:2px;}
.sp-info-t{font-size:18px;font-weight:600;color:var(--t1);letter-spacing:-.2px;line-height:1.25;}
.sp-info-meta{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--t2);}
.sp-info-meta-row{display:flex;align-items:flex-start;gap:10px;line-height:1.5;}
.sp-info-meta-row i{color:var(--t4);font-size:13px;width:14px;text-align:center;margin-top:3px;}
.sp-info-divider{height:1px;background:var(--bd);}
.sp-info-section-h{font-size:11px;font-weight:600;color:var(--t4);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.sp-info-section-d{font-size:13px;color:var(--t2);line-height:1.55;}
.sp-cal{padding:22px 24px;border-right:1px solid var(--bd);}
.sp-cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sp-cal-month{font-size:15px;font-weight:600;color:var(--t1);}
.sp-cal-arr{width:32px;height:32px;border-radius:8px;border:none;background:none;color:var(--t2);display:inline-flex;align-items:center;justify-content:center;font-size:13px;}
.sp-cal-arr:hover{background:var(--g-neutral-200);color:var(--t1);}
.sp-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:38px;gap:4px;justify-items:center;align-items:center;}
.sp-cal-dow{font-size:11px;font-weight:600;color:var(--t4);text-align:center;padding:6px 0;text-transform:uppercase;letter-spacing:.04em;height:auto;}
.sp-cal-day{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--t3);cursor:default;font-weight:500;position:relative;}
.sp-cal-day.avail{color:var(--t1);background:var(--g-brand-100);cursor:pointer;}
.sp-cal-day.avail:hover{background:var(--g-brand-200);}
.sp-cal-day.selected{background:var(--g-brand-primary)!important;color:#fff!important;}
.sp-slots{padding:22px 22px 18px;display:flex;flex-direction:column;}
.sp-slots-list{flex:1;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:460px;padding-right:4px;}
.sp-slot{padding:10px 14px;border:1.5px solid var(--bd);background:#fff;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--t1);text-align:center;}
.sp-slot:hover{border-color:var(--g-brand-primary);color:var(--g-brand-primary);}
.sp-slot.selected{background:var(--g-brand-primary);border-color:var(--g-brand-primary);color:#fff;}
.sp-slot[disabled]{opacity:.4;cursor:not-allowed;border-color:var(--bd);color:var(--t4);}
.sp-empty{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--t4);text-align:center;padding:30px 10px;}
.sp-foot{padding:18px 26px;border-top:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.sp-foot-l{font-size:13px;color:var(--t3);}
.sp-foot-l strong{color:var(--t1);font-weight:600;}

/* Form helpers */
.input{width:100%;height:46px;padding:0 14px;border:1px solid var(--bd);border-radius:10px;font-size:14px;font-family:inherit;color:var(--t1);outline:none;background:#fff;}
.input:focus{border-color:var(--g-brand-primary);box-shadow:0 0 0 3px rgba(87,102,242,.12);}
.fld-label{font-size:12.5px;font-weight:500;color:var(--t2);margin-bottom:6px;display:block;}
.req{color:#64748B;font-weight:500;margin-left:2px;}
.sel{position:relative;}
.sel select{width:100%;height:46px;border-radius:10px;border:1px solid var(--bd);background:#fff;padding:0 40px 0 14px;font-family:inherit;font-size:14px;color:var(--t1);appearance:none;outline:none;}
.sel::after{content:'\f078';font-family:"Font Awesome 6 Free";font-weight:900;position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:11px;pointer-events:none;}
textarea.input{height:auto;min-height:80px;padding:12px 14px;resize:vertical;line-height:1.55;}

/* Toast */
.toast{position:fixed;top:24px;right:24px;background:var(--t1);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;opacity:0;transform:translateY(-12px);transition:.2s;z-index:2000;}
.toast.show{opacity:1;transform:translateY(0);}

/* Empty state */
.empty{padding:60px 24px;text-align:center;background:#fff;border:1px solid var(--bd);border-radius:18px;}
.empty-ico{width:64px;height:64px;border-radius:18px;background:var(--g-neutral-200);color:var(--t4);display:inline-flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px;}
.empty-t{font-size:16px;font-weight:600;color:var(--t1);margin-bottom:6px;}
.empty-d{font-size:13.5px;color:var(--t3);max-width:420px;margin:0 auto 16px;line-height:1.55;}

/* ============ MOBILE BOTTOM NAV + SHEETS (hidden on desktop) ============ */
.mbnav,.mfab,.msheet,.msheet-backdrop{display:none;}
@media(max-width:767px){
  .mbnav{display:flex;}
  .mfab{display:inline-flex;}
  .msheet{display:block;}
  .msheet-backdrop{display:none;}
  .msheet-backdrop.show{display:block;}
}
.mbnav{position:fixed;bottom:0;left:0;right:0;height:72px;background:#fff;border-top:1px solid var(--bd);z-index:100;align-items:stretch;padding-bottom:env(safe-area-inset-bottom);}
.mbnav-tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--t3);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;font-family:inherit;padding:0;position:relative;}
.mbnav-tab i{font-size:22px;color:var(--t2);line-height:1;}
.mbnav-tab.active{color:var(--g-brand-primary);}
.mbnav-tab.active i{color:var(--g-brand-primary);}
.mbnav-tab.active::before{content:'';position:absolute;top:0;left:18%;right:18%;height:3px;background:var(--g-brand-primary);border-radius:0 0 3px 3px;}
.mbnav-tab.profile{padding:0;}
.mbnav-tab.profile .mbnav-av{width:34px;height:34px;border-radius:50%;overflow:hidden;flex-shrink:0;border:2px solid transparent;}
.mbnav-tab.profile.active .mbnav-av{border-color:var(--g-brand-primary);}
.mbnav-tab.profile .mbnav-av img{width:100%;height:100%;object-fit:cover;display:block;}

.mfab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:52px;height:52px;border-radius:50%;background:var(--g-neutral-800);color:#fff;border:none;align-items:center;justify-content:center;font-size:22px;box-shadow:0 8px 20px rgba(0,0,0,.18);z-index:99;cursor:pointer;}
.mfab:hover{background:var(--g-neutral-700);}

.msheet-backdrop{position:fixed;inset:0;background:rgba(15,15,20,.35);z-index:95;}
.msheet{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));background:#fff;border-radius:20px 20px 0 0;max-height:calc(100vh - 100px);overflow-y:auto;z-index:96;transform:translateY(110%);transition:transform .26s cubic-bezier(.22,.61,.36,1);box-shadow:0 -8px 32px rgba(0,0,0,.12);}
.msheet.open{transform:translateY(0);}
.msheet-head{display:flex;align-items:center;padding:18px 20px 14px;gap:12px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:#fff;z-index:2;}
.msheet-back{background:none;border:none;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:var(--t1);font-size:15px;cursor:pointer;flex-shrink:0;}
.msheet-back:hover{color:var(--t2);}
.msheet-title{flex:1;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--t1);}
.msheet-close{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:54px;height:54px;border-radius:50%;background:var(--g-neutral-200);border:none;color:var(--t1);font-size:13px;cursor:pointer;flex-shrink:0;line-height:1;}
.msheet-close span{font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:capitalize;margin-top:3px;color:var(--t2);}
.msheet-body{padding:8px 0 24px;}
.msheet-row{display:flex;align-items:center;gap:16px;padding:16px 22px;font-size:15px;color:var(--t1);text-decoration:none;cursor:pointer;background:none;border:none;width:100%;font-family:inherit;text-align:left;}
.msheet-row:active{background:var(--g-neutral-200);}
.msheet-row > i:first-child{font-size:22px;color:var(--t3);width:26px;text-align:center;line-height:1;flex-shrink:0;position:relative;}
.msheet-row .ms-chev{margin-left:auto;color:var(--t4);font-size:13px;}
.msheet-row .ms-icon-dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#ef4444;border:1.5px solid #fff;}
.msheet-row.is-active{color:var(--g-brand-primary);font-weight:500;}
.msheet-row.is-active > i:first-child{color:var(--g-brand-primary);}

/* ============ MOBILE / RESPONSIVE ============ */
@media(max-width:767px){
  /* Prevent any horizontal page scroll */
  html,body{overflow-x:hidden;max-width:100vw;}
  .app,.main{max-width:100vw;overflow-x:hidden;}
  img,video,iframe{max-width:100%;height:auto;}

  /* App shell: single column, sidebar hidden */
  .app{grid-template-columns:1fr;}
  .side,.side-toggle-wrap{display:none!important;}
  .det{grid-column:1;}

  /* Topbar — match content's 16px gutter so headings align */
  .topbar{padding:16px 16px 8px;flex-wrap:wrap;gap:10px;}
  .page-title{font-size:22px;letter-spacing:-.2px;}
  .tb-actions{margin-left:auto;}
  .btn{padding:0 16px;height:40px;font-size:13.5px;}

  /* Content padding — leave room for bottom nav */
  .main{min-width:0;}
  .content{padding:0 16px 110px;gap:18px;}
  .det-body{padding-bottom:120px;}

  /* Tabs: horizontal scroll */
  .tabs{padding:6px 16px 0;gap:20px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{padding:12px 4px;font-size:14px;white-space:nowrap;flex-shrink:0;}

  /* Panel: tighter padding */
  .panel{padding:16px;border-radius:14px;}
  .panel-head{flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .panel-title{font-size:17px;}

  /* Programs grid */
  .pgrid{grid-template-columns:1fr;gap:14px;}

  /* Session cards: stack actions below */
  .sess-card{grid-template-columns:auto 1fr;gap:12px;padding:16px;}
  .sess-actions{grid-column:1 / -1;flex-wrap:wrap;gap:8px;}

  /* Bookings — card layout (status + action right-clustered, like web) */
  .btable{width:100%;}
  .btable-head{display:none;}
  .brow{
    display:grid!important;
    grid-template-columns:1fr auto auto;
    grid-template-areas:
      "info    info    kebab"
      "date    date    date"
      "prog    prog    prog"
      ".       status  action";
    gap:10px 10px;align-items:start;
    padding:14px;border:1px solid var(--bd);border-radius:12px;
    background:#fff;margin-bottom:10px;width:100%;min-width:0;
  }
  .brow > *{min-width:0;}
  .brow > *:nth-child(1){grid-area:info;}
  .brow > *:nth-child(2){grid-area:date;}
  .brow > *:nth-child(3){grid-area:prog;}
  .brow > *:nth-child(4){grid-area:status;align-self:center;justify-self:end;}
  .brow > *:nth-child(5){grid-area:action;justify-self:end;align-self:center;}
  .brow > *:nth-child(6){grid-area:kebab;justify-self:end;align-self:start;}
  .brow:last-child{margin-bottom:0;}
  .brow .b-kebab{background:none;border:none;color:var(--t3);padding:4px 6px;cursor:pointer;}
  .bprog-cell{gap:12px;min-width:0;}
  .bprog-name,.bsess-name{white-space:normal;}
  .bsess-prog{width:100%;max-width:none;}

  /* ===== HEADING SIZE OPTIMISATION (mobile) ===== */
  .wiz-h1,h2.coaching-empty-h,h3.coaching-empty-h{font-size:22px!important;letter-spacing:-.3px;line-height:1.2;}
  .panel-title{font-size:17px;}
  .sec-h-t{font-size:16px;}
  .sec-h-d{font-size:12.5px;}
  .scard-t{font-size:15px;}
  .scard-d{font-size:12.5px;}
  .modal-t{font-size:16px;}
  .empty-t{font-size:15px;}
  .empty-d{font-size:13px;}
  .pcard-name{font-size:16px;}
  .sess-title{font-size:14.5px;}
  .bprog-name{font-size:14px;}
  .bsess-name{font-size:13px;}

  /* Filter bar */
  .filterbar{gap:8px;align-items:center;}
  .filterbar > *{flex-shrink:0;}
  .fdrop{font-size:12px;padding:0 10px;height:36px;}
  .filter-reset{height:36px;font-size:12px;padding:0 8px;}
  .search{flex:1 1 100%;}
  .search input{height:42px;font-size:13.5px;}
  .pager{margin-left:auto;font-size:12px;gap:6px;}
  .pager .arr{width:28px;height:28px;}

  /* Filter panels become bottom sheets */
  .fpanel{
    position:fixed!important;
    bottom:0!important;top:auto!important;left:0!important;right:0!important;
    width:100%!important;max-height:80vh;overflow-y:auto;
    border-radius:16px 16px 0 0;
    box-shadow:0 -8px 32px rgba(0,0,0,.14);
  }
  .fpanel::before{
    content:'';display:block;width:40px;height:4px;border-radius:2px;
    background:var(--g-neutral-300);margin:10px auto 8px;
  }
  /* Mini calendar stays inline on mobile */
  .mini-cal{
    position:static!important;width:100%!important;
    box-shadow:none!important;border:1px solid var(--bd)!important;
    margin-top:8px;
  }

  /* Modals: full-width with safe margin */
  .modal-bg{padding:14px;}
  .modal{max-width:100%!important;border-radius:14px;}
  .modal.v2{max-width:100%!important;}
  /* Session slot picker: full screen */
  .modal-bg .sp-modal{
    width:100%!important;max-width:100%!important;
    height:100%!important;border-radius:0!important;
    overflow-y:auto;
  }

  /* Calendar */
  .cal-cell{min-height:64px;padding:6px 4px 4px;}
  .cal-day{font-size:11px;}
  .cal-event{font-size:10px;padding:2px 4px;}
  .cal-nav{flex-wrap:wrap;gap:8px;}
  .cal-month-label{font-size:15px;min-width:0;}

  /* Program detail */
  .det-top{padding:14px 16px;flex-wrap:wrap;gap:8px;}
  .det-title{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .det-tabs{padding:0 12px;gap:18px;overflow-x:auto;}
  .dtab{white-space:nowrap;flex-shrink:0;}
  .det-body{padding:14px 14px 120px;}

  /* ===== Attachment rows: stack file info above View/Remove ===== */
  .mt-attach{flex-wrap:wrap;gap:10px;align-items:flex-start;padding:12px;}
  .mt-attach > div[style*="flex:1"]{flex:1 1 100%;min-width:0;}
  .mt-attach-name,.mt-attach-sub{word-break:break-word;overflow-wrap:anywhere;}
  .mt-attach .btn,.mt-attach .btn-w,.mt-attach .btn-sm{padding:0 12px;height:34px;font-size:12.5px;flex:0 0 auto;}

  /* ===== General text-wrap policy for mobile ===== */
  .pcard-name,.pcard-desc,
  .scard-t,.scard-d,
  .modal-t,
  .det-title,
  .bsess-name,.bsess-sub,.bsess-prog-l,
  .bprog-name,
  .sess-title,.sess-status,
  .panel-title,
  .empty-t,.empty-d{
    word-break:break-word;overflow-wrap:anywhere;white-space:normal;
  }
  .det-title{white-space:nowrap;}

  /* Long file names / URLs */
  code,kbd,samp{word-break:break-all;overflow-wrap:anywhere;}

  /* Header rows wrap title+actions */
  .scard-h,.panel-head,.mt-head{flex-wrap:wrap;gap:10px;}
  .sess-actions,.mt-actions{flex-wrap:wrap;gap:8px;}
  .sess-actions .btn,.sess-actions .btn-w,
  .mt-actions .btn,.mt-actions .btn-w{padding:0 12px;height:34px;font-size:12.5px;}

  /* Inline metadata strips */
  .sess-meta,.mt-meta{flex-wrap:wrap;gap:10px;}
}

@media(max-width:480px){
  .topbar{padding-left:60px;}
  .page-title{font-size:18px;}
  .cal-cell{min-height:54px;}
}

/* =========================================================================
   CUSTOM DROPDOWN (replaces native <select>)
   ========================================================================= */
select.dd-enhanced{position:absolute!important;left:0;top:0;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none!important;border:0!important;padding:0!important;margin:0!important;clip:rect(0 0 0 0);overflow:hidden;}
.dd-trig{
  font-family:inherit;font-size:14px;color:var(--t1);background:#fff;
  border:1px solid var(--bd);border-radius:10px;
  height:46px;padding:0 36px 0 14px;
  text-align:left;cursor:pointer;
  display:inline-flex;align-items:center;
  position:relative;width:100%;
  transition:border-color .15s, box-shadow .15s;
}
.dd-trig:focus{outline:none;}
.dd-trig:hover{border-color:var(--bd2);}
.dd-trig.open{border-color:var(--g-brand-primary);box-shadow:0 0 0 3px rgba(87,102,242,.12);}
.dd-trig::after{
  content:'\f078';font-family:"Font Awesome 6 Free";font-weight:900;
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  color:var(--t3);font-size:10px;pointer-events:none;
  transition:transform .15s;
}
.dd-trig.open::after{transform:translateY(-50%) rotate(180deg);}
.dd-trig .dd-trig-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:inherit;}
.dd-trig.placeholder .dd-trig-text{color:var(--t4);}

.sel{position:relative;}
.sel .dd-trig{width:100%;}
.sel:has(.dd-enhanced)::after{display:none;}
.dual-input > .sel .dd-trig{border:none;border-radius:0;background:transparent;height:46px;}
.dual-input > .sel .dd-trig.open{box-shadow:none;border-color:transparent;}
.slot .sel .dd-trig{height:42px;justify-content:center;text-align:center;padding:0 28px;}

.dd-menu{
  position:fixed;background:#fff;border:1px solid var(--bd);
  border-radius:12px;padding:6px;box-shadow:0 24px 60px -20px rgba(17,17,17,.18);
  z-index:10000;max-height:300px;overflow-y:auto;min-width:160px;
}
.dd-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 12px;border-radius:8px;font-size:14px;color:var(--t1);
  cursor:pointer;gap:10px;font-family:inherit;line-height:1.3;
}
.dd-item:hover{background:#EFF1F4;}
.dd-item.selected{background:var(--g-brand-100);color:var(--g-brand-primary);font-weight:500;}
.dd-item.selected::after{
  content:'\f00c';font-family:"Font Awesome 6 Free";font-weight:900;
  color:var(--g-brand-primary);font-size:12px;
}
.dd-item.disabled{opacity:.5;cursor:not-allowed;}
.dd-item.disabled:hover{background:none;}
</style>

const EV_CLS  = {upcoming:'ev-up',completed:'ev-co',cancelled:'ev-ca',missed:'ev-mi',pending:'ev-pn'};
const EV_ICON = {upcoming:'fa-solid fa-circle-dot',completed:'fa-solid fa-circle-check',cancelled:'fa-solid fa-circle-xmark',missed:'fa-solid fa-circle-minus',pending:'fa-regular fa-circle'};

function buildBookingDateMap(){
  const map = {};
  PROGRAMS.forEach(p => p.sessions.forEach(s => {
    if(!s.date) return;
    // formats: "May 8, 2026 · 11:00 AM IST" OR "May 8, 2026 · 11:00 AM IST"
    const m = s.date.match(/(\w+)\s+(\d+),\s+(\d+)/);
    if(!m) return;
    const months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const dt = new Date(parseInt(m[3]), months[m[1].slice(0,3)], parseInt(m[2]));
    const key = dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
    if(!map[key]) map[key]=[];
    map[key].push({...s, prog:p});
  }));
  return map;
}

function renderLrnCalendar(){
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const today = new Date();
  const first = new Date(calYear, calMonth, 1);
  const last  = new Date(calYear, calMonth+1, 0);
  const startDay = first.getDay();
  const map = buildBookingDateMap();
  const cells = [];
  for(let i=0;i<startDay;i++){
    const d = new Date(calYear, calMonth, -startDay+i+1);
    cells.push({date:d, otherMonth:true});
  }
  for(let d=1;d<=last.getDate();d++) cells.push({date:new Date(calYear,calMonth,d), otherMonth:false});
  const remaining = 42 - cells.length;
  for(let d=1;d<=remaining;d++) cells.push({date:new Date(calYear,calMonth+1,d), otherMonth:true});

  const cellsHTML = cells.map(c=>{
    const isToday = c.date.toDateString()===today.toDateString();
    const key = c.date.getFullYear()+'-'+String(c.date.getMonth()+1).padStart(2,'0')+'-'+String(c.date.getDate()).padStart(2,'0');
    const evts = map[key] || [];
    const evtHtml = evts.slice(0,2).map(e=>
      `<div class="cal-event ${EV_CLS[e.state]||'ev-up'}" onclick="event.stopPropagation();previewCalendarEvent('${e.id}','${e.prog.id}')" title="${e.name} · ${e.prog.name}">
         <i class="${EV_ICON[e.state]||EV_ICON.upcoming}"></i>${e.prog.name}
      </div>`
    ).join('');
    const more = evts.length>2 ? `<div class="cal-more">+${evts.length-2} more</div>` : '';
    return `<div class="cal-cell${c.otherMonth?' other-month':''}${isToday?' today':''}">
      <div class="cal-day">${c.date.getDate()}</div>
      ${evtHtml}${more}
    </div>`;
  }).join('');

  return `
    <div class="cal-nav">
      <button class="cal-nav-btn" onclick="lrnCalShift(-1)"><i class="fa-solid fa-chevron-left"></i></button>
      <div class="cal-month-label">${months[calMonth]} ${calYear}</div>
      <button class="cal-nav-btn" onclick="lrnCalShift(1)"><i class="fa-solid fa-chevron-right"></i></button>
      <button class="btn btn-w btn-sm" style="margin-left:auto;" onclick="lrnCalGoToday()">Today</button>
    </div>
    <div class="cal-grid-head">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div class="cal-grid">${cellsHTML}</div>
  `;
}
function lrnCalShift(dir){
  calMonth += dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  renderCoaching();
}
function lrnCalGoToday(){
  const t = new Date();
  calYear=t.getFullYear(); calMonth=t.getMonth();
  renderCoaching();
}

/* Booking table row */
function timeRange(start, durationMin){
  const m = start.match(/^(\d+):(\d+)\s*(AM|PM)\s*(.*)$/i);
  if(!m) return start;
  let h = parseInt(m[1]), mins = parseInt(m[2]), period = m[3].toUpperCase(), tz = m[4].trim();
  let endMins = mins + durationMin, endH = h;
  if(endMins >= 60){ endH += Math.floor(endMins/60); endMins %= 60; }
  let endPeriod = period;
  if(endH === 12 && period === 'AM') endPeriod = 'PM';
  if(endH > 12){ endH -= 12; endPeriod = period === 'AM' ? 'PM' : 'AM'; }
  return `${h}:${String(mins).padStart(2,'0')} ${period} - ${endH}:${String(endMins).padStart(2,'0')} ${endPeriod} ${tz}`.trim();
}

  const status = s.state;
  // Program-level "expired" overrides the session label when the session hasn't been
  // used yet (pending or missed). Already-completed sessions keep their own label.
  const showExpired = s.prog.status === 'expired' && (status==='pending' || status==='missed');
  const statusLabel = showExpired ? 'Expired'
    : status==='pending' ? 'Ready to book'
    : status.charAt(0).toUpperCase()+status.slice(1);
  const statusCls = showExpired ? 'bs-ex'
    : status==='upcoming'?'bs-up'
    : status==='completed'?'bs-cm'
    : status==='cancelled'?'bs-cn'
    : status==='missed'?'bs-ms'
    : status==='live'?'bs-live'
    : 'bs-pn';
  const statusDisplay = status==='live' ? 'Live' : statusLabel;
  const action = status==='live'
    ? `<button class="b-join" onclick="event.stopPropagation();toast('Joining session…')"><i class="fa-solid fa-video"></i>Join</button>`
    : status==='upcoming'
      ? (s.joinable ? `<button class="b-join" onclick="event.stopPropagation();toast('Joining session…')"><i class="fa-solid fa-video"></i>Join</button>` : `<button class="b-join disabled" data-tip="Join enables 5 minutes before the session" onclick="event.stopPropagation()"><i class="fa-solid fa-video"></i>Join</button>`)
      : status==='completed' && s.hasVideo
        ? (s.daysLeft > 0
          ? `<button class="b-join b-watch" onclick="event.stopPropagation()"><i class="fa-solid fa-play"></i>Watch</button>`
          : `<button class="b-join b-watch disabled" data-tip="Recording expired — a download link was emailed after the session" onclick="event.stopPropagation()"><i class="fa-solid fa-play"></i>Watch</button>`)
        : status==='pending'
          ? (s.prog.status==='expired'
            ? `<button class="b-join disabled" data-tip="This program has expired — booking is no longer available" onclick="event.stopPropagation()"><i class="fa-regular fa-calendar"></i>Book</button>`
            : `<button class="b-join" onclick="event.stopPropagation();openSlotPicker('${s.prog.id}','${s.id}')"><i class="fa-regular fa-calendar"></i>Book</button>`)
          : status==='missed'
            ? (s.prog.status==='expired'
              ? `<button class="b-join b-watch disabled" data-tip="This program has expired — booking is no longer available" onclick="event.stopPropagation()"><i class="fa-regular fa-calendar"></i>Rebook</button>`
              : `<button class="b-join b-watch" onclick="event.stopPropagation();openSlotPicker('${s.prog.id}','${s.id}')"><i class="fa-regular fa-calendar"></i>Rebook</button>`)
            : '';
  const pct = Math.round(s.prog.completed/s.prog.total*100);
  const isDone = s.prog.completed === s.prog.total;
  return `
    <div class="brow" onclick="openSessionDetail('${s.id}','${s.prog.id}')">
      <div class="bprog-cell">
        <div class="bthumb" style="background-image:url('${s.prog.image}');"></div>
        <div style="min-width:0;">
          <div class="bprog-name">${s.name}</div>
          <div class="bsess-sub">${s.prog.name}</div>
        </div>
      </div>
      <div class="bdate">${date||'<span style="color:var(--t4);">Not scheduled</span>'}${time?`<small>${time}</small>`:''}</div>
      <div class="bsess-prog">
        <div class="bsess-prog-l"><strong>${s.prog.completed}</strong> of ${s.prog.total} sessions</div>
        <div class="bsess-prog-bar">${Array.from({length:s.prog.total}).map((_,i)=>`<span class="${i<s.prog.completed?(isDone?'done-success':'done'):''}"></span>`).join('')}</div>
      </div>
      <div><span class="bstatus ${statusCls}">${statusDisplay}</span></div>
      <div class="bact">${action}</div>
      <button class="b-kebab" onclick="event.stopPropagation();openRowMenu(event,'${s.id}','${s.prog.id}','${status}')"><i class="fa-solid fa-ellipsis-vertical"></i></button>

/* ============ DAY GROUPING (same pattern as creator timeline) ============ */
function dayLabel(dateStr){
  if(!dateStr) return {day:'Not scheduled', dayLong:''};
  const m = dateStr.match(/^([A-Za-z]+)\s+(\d+),\s+(\d+)/);
  if(!m) return {day:dateStr, dayLong:''};
  const months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const monKey = m[1].slice(0,3);
  const dt = new Date(parseInt(m[3]), months[monKey], parseInt(m[2]));
  const today = new Date(2026, 4, 11);
  today.setHours(0,0,0,0); dt.setHours(0,0,0,0);
  const diff = Math.round((dt - today) / 86400000);
  const weekdays = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const longLabel = `${weekdays[dt.getDay()]}, ${monKey} ${m[2]}`;
  let day;
  if(diff === 0) day = 'Today';
  else if(diff === 1) day = 'Tomorrow';
  else if(diff === -1) day = 'Yesterday';
  else if(diff > 1 && diff <= 7) day = 'This week';
  else if(diff < -1 && diff >= -7) day = 'Last week';
  else if(diff < -7 && diff >= -14) day = 'Two weeks ago';
  else day = `${monKey} ${m[2]}`;
  return {day, dayLong: longLabel};
}

function renderGroupedSessions(p, c){
  const sessions = p.sessions.map(s => ({...s, ...dayLabel(s.date)}));
  const grouped = {};
  const order = [];
  sessions.forEach(s => {
    if(!grouped[s.day]){ grouped[s.day] = {dayLong:s.dayLong, items:[]}; order.push(s.day); }
    grouped[s.day].items.push(s);
  });
  return order.map(day => `
    <div class="tl-day">
      <div class="tl-day-h"><span class="tl-day-t">${day}</span>${grouped[day].dayLong?`<span class="tl-day-sub">${grouped[day].dayLong}</span>`:''}</div>
      ${grouped[day].items.map(s => renderLrnSessCard(s, p, c)).join('')}
    </div>`).join('');
}
